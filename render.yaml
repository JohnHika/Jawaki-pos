services:
  - type: keyvalue
    name: arche-axon-pos-redis
    plan: free
    ipAllowList: []

  - type: web
    name: arche-axon-pos-api
    runtime: node
    plan: free
    region: oregon
    branch: update-feature
    healthCheckPath: /health
    buildCommand: cd backend && npm ci --include=dev && npx prisma generate && npm run build
    preDeployCommand: cd backend && npx prisma migrate deploy
    startCommand: cd backend && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: arche-axon-pos-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: arche-axon-pos-redis
          property: port
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: nvidia/llama-3.1-nemotron-70b-instruct
