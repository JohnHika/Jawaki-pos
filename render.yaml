services:
  - type: keyvalue
    name: arche-axon-pos-redis
    plan: free
    ipAllowList: []

  - type: web
    name: arche-axon-pos-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    buildCommand: cd backend && npm ci --include=dev && npx prisma generate && npm run build
    # Migrations gate the deploy (strict &&); the permission seed runs after
    # and is best-effort (|| echo) so a transient DB blip while seeding never
    # blocks a deploy — the seed is idempotent (all upserts) and retries on the
    # next deploy. This stops new permission keys from silently missing in prod
    # (e.g. sales.close_end_of_day previously needed a manual seed run).
    # NOTE: preDeployCommand does NOT run on Render free tier, so migrations
    # must also run in startCommand. The --retries flag handles transient
    # Neon advisory-lock timeouts (P1002).
    preDeployCommand: cd backend && npx prisma migrate deploy --retries 3 && (npx ts-node --transpile-only scripts/seed-permissions.ts || echo "seed-permissions skipped (non-fatal)")
    startCommand: cd backend && npx prisma migrate deploy --retries 3 && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: ADMIN_API_SECRET
        generateValue: true
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: arche-axon-pos-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: arche-axon-pos-redis
          property: port
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
      # Axon Gateway (arche-axon.xyz) — primary AI provider. Key set in the
      # Render dashboard (sync:false managed secret); base URL has a code
      # default but is declared here for clarity.
      - key: AXON_GATEWAY_API_KEY
        sync: false
      - key: AXON_GATEWAY_BASE_URL
        value: https://api.arche-axon.xyz/v1
      - key: AI_BILLING_DISABLED
        value: "false"
      - key: ANDROID_APP_LATEST_VERSION
        value: "1.0.40"
      - key: ANDROID_APP_RELEASE_NAME
        value: "Axon POS 1.0.40"
      - key: ANDROID_APP_BUILD_NUMBER
        value: "2046"
      - key: ANDROID_APP_MIN_SUPPORTED_VERSION
        value: "1.0.0"
      - key: ANDROID_APP_MIN_SUPPORTED_BUILD_NUMBER
        value: "1"
      - key: ANDROID_APP_FORCE_UPDATE
        value: "false"
      - key: ANDROID_APP_APK_URL
        value: "/api/v1/app-updates/android/download"
      - key: ANDROID_APP_RELEASE_NOTES
        value: "Smarter AI assistant: it now reads your real POS data as fact (no more 'check your connection' when you simply have no sales yet), a cleaner chat with a working + button to attach camera/photos/files (reads text from images), copy and edit on messages, and the receipt now previews exactly as it prints."
