name: Copy releases (one time)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Copy every listed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 copy_releases.py JohnHika/Jawaki-pos "$GITHUB_REPOSITORY"
