name: Keep Backend Warm

# Render's free tier spins the service down after ~15 minutes idle and takes
# 30-60+ seconds to cold-start on the next request — longer than the mobile
# app's 30s network timeout, so the first request after any idle period
# (very often the user's login/catalog-sync right after opening the app)
# times out and fails. Pinging /health well inside that 15-minute window
# keeps the instance from ever fully sleeping.

on:
  schedule:
    # Two offsets hedge GitHub Actions' documented schedule drift (runs can
    # land minutes late): one every 10 min from :00, one offset by 4 min.
    - cron: '*/10 * * * *'
    - cron: '4-59/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend DB-touching health endpoint
        run: |
          set +e
          # Ping /health/db, not bare /health: /health never reaches
          # Postgres, so Neon's free compute suspends after 5 idle minutes
          # and the first user pays the wake penalty on their first query.
          # /health/db runs SELECT 1, keeping BOTH Render and Neon warm.
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            --connect-timeout 15 \
            --max-time 60 \
            --retry 2 \
            --retry-delay 5 \
            --retry-max-time 90 \
            "https://arche-axon-pos-api.onrender.com/health/db")
          curl_exit=$?
          set -e

          if [ "$curl_exit" -ne 0 ]; then
            echo "Health check request failed with curl exit code $curl_exit (HTTP ${status:-000})"
            echo "::warning::Backend health check could not complete; the service may be cold-starting or temporarily unavailable."
            exit 0
          fi

          echo "Health check returned HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::warning::Backend health check did not return 200 (got $status) — may still be cold-starting."
          fi
