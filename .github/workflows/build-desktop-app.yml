name: Build and Publish Desktop App

on:
  push:
    branches: [main, update-feature]
  pull_request:
    branches: [main, update-feature]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Desktop quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.1
          cache: true

      - name: Get desktop dependencies
        working-directory: desktop
        run: flutter pub get

      - name: Analyze desktop app
        working-directory: desktop
        run: flutter analyze --no-fatal-infos

      - name: Test desktop app
        working-directory: desktop
        run: flutter test

  build:
    name: Build ${{ matrix.label }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            platform: windows
            artifact: axon-pos-desktop-windows
          - label: macOS
            os: macos-latest
            platform: macos
            artifact: axon-pos-desktop-macos
          - label: Linux
            os: ubuntu-latest
            platform: linux
            artifact: axon-pos-desktop-linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev ninja-build

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.1
          cache: true

      - name: Get desktop dependencies
        working-directory: desktop
        run: flutter pub get

      - name: Build native desktop app
        working-directory: desktop
        run: flutter build ${{ matrix.platform }} --release

      - name: Package Windows app
        if: matrix.platform == 'windows'
        working-directory: desktop
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "$env:RUNNER_TEMP/${{ matrix.artifact }}.zip"

      - name: Package macOS app
        if: matrix.platform == 'macos'
        working-directory: desktop
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/desktop.app "$RUNNER_TEMP/${{ matrix.artifact }}.zip"

      - name: Package Linux app
        if: matrix.platform == 'linux'
        working-directory: desktop
        run: tar -czf "$RUNNER_TEMP/${{ matrix.artifact }}.tar.gz" -C build/linux/x64/release bundle

      - name: Upload downloadable desktop build
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/${{ matrix.artifact }}.*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish desktop release
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          pattern: axon-pos-desktop-*
          merge-multiple: true

      - name: Publish GitHub desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: desktop-v1.1.0-${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Axon POS Desktop $RELEASE_TAG" \
            --notes "Axon POS Desktop 1.1: live sign-in, live catalog, customers, inventory, reports, product images, and cash sales. Built from the independent desktop project in desktop/."
