name: Build and Publish Axon POS Desktop

on:
  push:
    branches: [main, update-feature]
  pull_request:
    branches: [main, update-feature]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Desktop quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libblkid-dev liblzma-dev

      - name: Enable desktop targets
        working-directory: .
        run: flutter config --enable-linux-desktop --enable-windows-desktop --enable-macos-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Static analysis and tests
        run: |
          flutter analyze --no-fatal-infos
          flutter test

  build:
    name: Build ${{ matrix.label }}
    needs: quality
    defaults:
      run:
        working-directory: mobile
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            target: windows
            label: Windows
          - os: macos
            runner: macos-latest
            target: macos
            label: macOS
          - os: linux
            runner: ubuntu-latest
            target: linux
            label: Linux
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libblkid-dev liblzma-dev

      - name: Enable desktop target
        working-directory: .
        shell: bash
        run: flutter config --enable-${{ matrix.os }}-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Read app version
        id: version
        shell: bash
        working-directory: .
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          content = Path('pubspec.yaml').read_text(encoding='utf-8')
          match = re.search(r'^version:\s*([^+\s]+)(?:\+(\S+))?', content, re.MULTILINE)
          if not match:
              raise SystemExit('Could not find app version in mobile/pubspec.yaml')
          semantic = match.group(1)
          build = match.group(2) or '0'
          full = f'{semantic}+{build}'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'semantic={semantic}\n')
              output.write(f'build={build}\n')
              output.write(f'full={full}\n')
          PY

      - name: Build desktop application
        run: flutter build ${{ matrix.target }} --release

      - name: Package Windows installer bundle
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/axon-pos-windows-${{ steps.version.outputs.full }}.zip" -CompressionLevel Optimal

      - name: Package macOS application bundle
        if: matrix.os == 'macos'
        shell: bash
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/axon_pos.app \
            "dist/axon-pos-macos-${{ steps.version.outputs.full }}.zip"

      - name: Package Linux application bundle
        if: matrix.os == 'linux'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/axon-pos-linux-${{ steps.version.outputs.full }}.tar.gz" \
            -C build/linux/x64/release bundle

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: axon-pos-${{ matrix.os }}-${{ steps.version.outputs.full }}
          path: mobile/dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish desktop downloads
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Read app version
        id: version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          content = Path('mobile/pubspec.yaml').read_text(encoding='utf-8')
          match = re.search(r'^version:\s*([^+\s]+)(?:\+(\S+))?', content, re.MULTILINE)
          if not match:
              raise SystemExit('Could not find app version in mobile/pubspec.yaml')
          semantic = match.group(1)
          build = match.group(2) or '0'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'full={semantic}+{build}\n')
              output.write(f'tag=desktop-v{semantic}-{build}\n')
          PY

      - name: Create desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: .
        run: |
          tag='${{ steps.version.outputs.tag }}'
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Axon POS Desktop ${{ steps.version.outputs.full }}" \
              --notes "Desktop builds for Windows, macOS, and Linux from $GITHUB_SHA."
          fi

          while IFS= read -r -d '' asset; do
            gh release upload "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
          done < <(find dist -type f -print0)

          {
            echo "## Desktop downloads"
            echo
            echo "[Open the desktop release](https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag)"
          } >> "$GITHUB_STEP_SUMMARY"
