name: axon_pos
description: Axon POS - Professional Point of Sale Platform by Arche Axon Intelligence
publish_to: 'none'
version: 1.0.49+2065

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Navigation
  go_router: ^13.0.1
  
  # Networking
  dio: ^5.4.0
  retrofit: ^4.0.3
  
  # Local Database (Offline-first)
  drift: ^2.14.1
  drift_sqflite: ^2.0.1
  sqlite3_flutter_libs: ^0.5.18
  # sqlcipher_flutter_libs: ^0.5.7  # Commented out to avoid duplicate class conflict
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # Dependency Injection
  get_it: ^7.6.4
  injectable: ^2.3.2
  
  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  
  # Forms & Validation
  reactive_forms: ^16.1.1
  
  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.2
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  
  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  
  # Connectivity
  connectivity_plus: ^5.0.2
  
  # Background Work & Sync
  workmanager: ^0.9.0+3
  
  # Printing & Receipts — using the esc_pos_utils_plus fork (same
  # package:esc_pos_utils import path, drop-in) because it depends on
  # image ^4.x, needed for compatibility with the pdf/printing packages
  # added for multi-format export; the original esc_pos_utils pins image
  # ^3.0.2 and conflicts with pdf.
  esc_pos_utils_plus: ^2.0.4
  # TODO: Add bluetooth printing support with updated package

  # QR Code (for payments)
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0

  # Animations
  flutter_animate: ^4.3.0
  lottie: ^3.0.0

  # Typography
  google_fonts: ^6.2.1

  # Search
  easy_search_bar: ^2.5.0

  # Biometric Authentication
  local_auth: ^2.2.0

  # HTTP Server (for Phone Server Mode)
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  http_parser: ^4.0.2

  # Crypto (for token generation)
  crypto: ^3.0.3

  # HTTP Client (for update checks & API calls)
  http: ^1.2.1

  # URL Launcher (for opening update links)
  url_launcher: ^6.2.5
  open_filex: ^4.7.0

  # Charts & Graphs
  fl_chart: ^0.65.0

  # Share Plus
  share_plus: ^7.2.1

  # Branded PDF report/export generation
  pdf: ^3.11.1
  printing: ^5.13.1

  # Supplier receipt capture and on-device OCR
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.16.0
  package_info_plus: ^9.0.1

  # Markdown rendering for AI chat responses (tables, lists, bold/italic)
  gpt_markdown_lite: ^1.0.16

  # On-device speech-to-text for AI chat voice input (offline, no API key)
  speech_to_text: ^7.0.0

  # Bluetooth transport for the ESC/POS thermal receipt printer (esc_pos_utils
  # above builds the print commands; this sends them over Bluetooth Classic)
  print_bluetooth_thermal: ^1.1.7
  permission_handler: ^12.0.3

  # Push notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  google_sign_in: 6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # Code Generation
  build_runner: ^2.4.7
  drift_dev: ^2.14.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
